<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="원불교 경기인천교구 교당을 검색하고 오시는 길을 확인하세요.">
  <meta name="theme-color" content="#f15a25">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:site_name" content="원불교 경기인천교구">
  <meta property="og:title" content="원불교 경기인천교구">
  <meta property="og:description" content="가장 가까운 지하철과 버스정류장을 확인하세요.">
  <meta property="og:image" content="https://location-guide-eight.vercel.app/gyeongin-logo.png">
  <meta property="og:image:width" content="1935">
  <meta property="og:image:height" content="601">
  <meta property="og:image:alt" content="원불교 경기인천교구 로고">
  <meta property="og:url" content="https://location-guide-eight.vercel.app/">
  <link rel="canonical" href="https://location-guide-eight.vercel.app/">
  <title>원불교 경기인천교구</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 바로가기</a>
  <main id="main" class="app-shell">
    <section class="search-panel" aria-labelledby="pageTitle">
      <img class="brand-logo" src="gyeongin-logo.png" alt="경인교구">
      <h1 id="pageTitle">열린 교화, 친절한 교당</h1>
      <form id="searchForm" class="search-form" role="search">
        <label class="sr-only" for="searchInput">방문할 장소</label>
        <input id="searchInput" name="q" type="search" placeholder="예: 원불교 서울교당" autocomplete="off" required maxlength="80">
        <button type="submit">
          <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="6.5"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
          <span>찾아보기</span>
        </button>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="candidateSection" class="results-section" aria-labelledby="candidateTitle" hidden>
      <h2 id="candidateTitle">검색 결과</h2>
      <p class="section-help">방문할 장소를 선택하세요.</p>
      <div id="candidateList" class="candidate-list"></div>
    </section>

    <section id="placeSection" class="results-section" aria-live="polite" hidden>
      <article class="place-card">
        <div class="place-heading">
          <span class="mini-pin" aria-hidden="true"></span>
          <div><p class="eyebrow">오시는 길</p><h2 id="placeName"></h2></div>
        </div>
        <p id="placeAddress" class="address"></p>
        <div class="map-actions">
          <a id="kakaoMapLink" class="map-button kakao" target="_blank" rel="noopener noreferrer">K 카카오맵</a>
          <a id="naverMapLink" class="map-button naver" target="_blank" rel="noopener noreferrer">N 네이버지도</a>
        </div>
      </article>

      <div id="transportCards" class="transport-grid"></div>

      <div id="phoneWrap" class="contact-card" hidden>
        <span>전화번호</span><a id="phoneLink"></a>
      </div>

      <button id="shareButton" class="share-button" type="button">↗ 위치 공유</button>
      <p class="privacy-note">현재 위치를 요청하거나 저장하지 않습니다. 검색과 경로 조회는 카카오 공식 API를 사용합니다.</p>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
