    <main id="main" class="app-shell" aria-busy="true">
      <section id="searchScreen" class="screen search-screen" aria-labelledby="searchTitle">
        <div class="hero-card">
          <p class="eyebrow">원불교 경기인천교구</p>
          <h1 id="searchTitle"><span>열린 교화</span><span>친절한 교당</span></h1>
          <form id="searchForm" class="search-form" role="search">
            <label class="sr-only" for="searchInput">교당명 검색</label>
            <div class="search-field">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
              <input id="searchInput" name="q" type="search" list="templeSuggestions" placeholder="교당명을 입력하세요" autocomplete="off" maxlength="60" required>
              <datalist id="templeSuggestions"></datalist>
            </div>
            <button class="primary-button" type="submit">검색</button>
          </form>
          <p id="loadStatus" class="status" role="status" aria-live="polite"></p>
        </div>
      </section>
      <section id="resultsScreen" class="screen" aria-labelledby="resultsTitle" hidden>
        <div class="screen-heading">
          <button id="resultsBackButton" class="back-button" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>다시 검색</button>
          <h1 id="resultsTitle" tabindex="-1">검색 결과</h1>
          <p id="resultCount" class="sr-only" aria-live="polite"></p>
        </div>
        <div id="resultList" class="result-list"></div>
        <p id="emptyState" class="empty-state" role="status" hidden>검색 결과가 없습니다.</p>
      </section>
      <section id="detailScreen" class="screen" aria-labelledby="templeTitle" hidden>
        <div class="screen-heading">
          <button id="detailBackButton" class="back-button" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>검색 결과</button>
          <h1 id="templeTitle" tabindex="-1"></h1>
        </div>
        <div class="detail-stack">
          <section id="videoSection" class="video-section" aria-label="교당 소개 영상" hidden>
            <div class="video-frame"><iframe id="youtubeFrame" title="교당 소개 영상" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
          </section>
          <section id="blogSection" hidden>
            <a id="blogLink" class="blog-button" target="_blank" rel="noopener noreferrer"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path></svg><span></span></a>
          </section>
          <section class="info-card" aria-labelledby="addressLabel">
            <div class="info-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg></div>
            <div class="info-content"><h2 id="addressLabel">주소</h2><p id="addressText"></p></div>
            <button id="copyAddressButton" class="copy-button" type="button">복사</button>
          </section>
          <section id="phoneSection" class="info-card" aria-labelledby="phoneLabel" hidden>
            <div class="info-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c1 .4 1.9.6 2.9.7a2 2 0 0 1 1.7 2Z"></path></svg></div>
            <div class="info-content"><h2 id="phoneLabel">전화번호</h2><p id="phoneText"></p></div>
            <button id="copyPhoneButton" class="copy-button" type="button">복사</button>
          </section>
          <nav class="map-actions" aria-label="지도 서비스">
            <a id="kakaoMapLink" class="map-button kakao-button" target="_blank" rel="noopener noreferrer">카카오맵</a>
            <a id="naverMapLink" class="map-button naver-button" target="_blank" rel="noopener noreferrer">네이버지도</a>
          </nav>
        </div>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
