<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="원불교 경기인천교구 교당의 주소와 연락처를 찾아보세요.">
    <meta name="theme-color" content="#f15a24">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:site_name" content="원불교 경기인천교구 교당 안내">
    <meta property="og:title" content="원불교 경기인천교구 교당 안내">
    <meta property="og:description" content="열린 교화, 친절한 교당 — 가까운 교당을 찾아보세요.">
    <meta property="og:image" content="https://wongi-location.vercel.app/og-image.png">
    <meta property="og:url" content="https://wongi-location.vercel.app/">
    <link rel="canonical" href="https://wongi-location.vercel.app/">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon-192.png" type="image/png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.3/dotum.min.css">
    <link rel="stylesheet" href="/styles.css">
    <title>원불교 경기인천교구 교당 안내</title>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">본문으로 바로가기</a>
    <header class="site-header" aria-label="서비스 헤더">
      <button id="headerHomeButton" class="brand-button" type="button" aria-label="처음으로 돌아가기">
        <img src="/로고-인쇄-오렌지블랙.png" alt="원불교 경기인천교구">
      </button>
    </header>

    <main id="main" class="app-shell" aria-busy="true">
      <section id="searchScreen" class="screen search-screen" aria-labelledby="searchTitle">
        <div class="hero-card">
          <p class="welcome">반갑습니다. 경기인천교구 교당을 방문해 보세요</p>
          <h1 id="searchTitle">열린 교화, 친절한 교당</h1>
          <form id="searchForm" class="search-form" role="search">
            <label class="sr-only" for="searchInput">교당명 검색</label>
            <div class="search-field">
              <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
              <input id="searchInput" name="q" type="search" placeholder="교당명을 입력하세요" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="60" required disabled>
            </div>
            <button id="searchButton" class="primary-button" type="submit" disabled>검색</button>
          </form>
          <div class="load-panel" aria-live="polite">
            <p id="loadStatus" class="status" role="status">교당 정보를 불러오는 중...</p>
            <button id="retryButton" class="retry-button" type="button" hidden>다시 시도</button>
          </div>
        </div>
        <section class="browse-section" aria-labelledby="districtTitle">
          <h2 id="districtTitle">지구별 교당</h2>
          <div id="districtList" class="district-list"></div>
        </section>
        <section class="browse-section" aria-labelledby="lineTitle">
          <h2 id="lineTitle">노선별 교당</h2>
          <div id="lineList" class="line-list"></div>
        </section>
      </section>

      <section id="resultsScreen" class="screen" aria-labelledby="resultsTitle" hidden>
        <div class="screen-heading">
          <button id="resultsBackButton" class="back-button" type="button" aria-label="검색 화면으로 돌아가기">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>다시 검색
          </button>
          <h1 id="resultsTitle" tabindex="-1">검색 결과</h1>
          <p id="resultCount" class="sr-only" aria-live="polite"></p>
        </div>
        <div id="resultList" class="result-list"></div>
        <p id="emptyState" class="empty-state" role="status" hidden>검색 결과가 없습니다.</p>
      </section>

      <section id="detailScreen" class="screen" aria-labelledby="templeTitle" hidden>
        <div class="screen-heading">
          <button id="detailBackButton" class="back-button" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>검색 결과
          </button>
          <h1 id="templeTitle" tabindex="-1"></h1>
        </div>
        <div class="detail-stack">
          <section id="videoSection" class="video-section" aria-label="교당 소개 영상" hidden>
            <div class="video-frame"><iframe id="youtubeFrame" title="교당 소개 영상" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
          </section>
          <section id="blogSection" hidden>
            <a id="blogLink" class="blog-button" target="_blank" rel="noopener noreferrer"><span></span></a>
          </section>
          <section id="phoneSection" class="info-card" aria-labelledby="phoneLabel" hidden>
            <div class="info-content"><h2 id="phoneLabel">전화</h2><p id="phoneText"></p></div>
            <button id="copyPhoneButton" class="copy-button" type="button">복사</button>
          </section>
          <section class="info-card" aria-labelledby="addressLabel">
            <div class="info-content"><h2 id="addressLabel">주소</h2><p id="addressText"></p></div>
            <button id="copyAddressButton" class="copy-button" type="button">복사</button>
          </section>
          <nav class="map-actions" aria-label="지도 서비스">
            <a id="kakaoMapLink" class="map-button kakao-button" target="_blank" rel="noopener noreferrer">카카오맵</a>
            <a id="naverMapLink" class="map-button naver-button" target="_blank" rel="noopener noreferrer">네이버지도</a>
          </nav>
          <button id="detailHomeButton" class="home-button" type="button">처음으로 돌아가기</button>
        </div>
      </section>
    </main>
    <div id="lineModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="lineModalTitle" hidden>
      <section class="line-modal">
        <header class="modal-heading">
          <h2 id="lineModalTitle" tabindex="-1"></h2>
          <button id="lineModalClose" class="modal-close" type="button" aria-label="노선별 교당 목록 닫기">×</button>
        </header>
        <div id="lineTempleList" class="modal-temple-list"></div>
      </section>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
